name: Paper
on:
  push:
    branches: [main]
    tags: ["hodge-sextic-*"]
    paths-ignore: []
  pull_request:
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp commit
        run: sed -i "s/COMMITHASH/${GITHUB_SHA::12}/" paper/hodge_sextic/hodge_sextic.tex
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: hodge_sextic.tex
          working_directory: paper/hodge_sextic
      - uses: actions/upload-artifact@v4
        with:
          name: hodge_sextic
          path: |
            paper/hodge_sextic/hodge_sextic.pdf
            paper/hodge_sextic/hodge_sextic.tex
