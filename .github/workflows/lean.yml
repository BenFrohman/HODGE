name: Lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Typechecks Hodge.lean. Does not prove the Hodge conjecture.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid Attempt imports in Hodge.lean
        run: |
          if grep -nE '^import[[:space:]]+Hodge\.Attempt' Hodge.lean; then
            echo "ARCHITECTURE: Hodge.lean must not import Hodge.Attempt.*"
            exit 1
          fi
      - name: Sorry check on the built library
        run: |
          if grep -nE '\bsorry\b' Hodge.lean Hodge/*.lean; then
            echo "sorry in the built library"
            exit 1
          fi
          echo "no sorry in Hodge.lean or Hodge/*.lean"
      - name: Build Hodge
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          test: false
          build-args: Hodge

  attempt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report sandbox sorry
        run: |
          echo "HodgeAttempt is the sandbox. It is not the Clay sentence."
          grep -nE '\bsorry\b' Hodge/Attempt/*.lean || echo "no sorry in Hodge/Attempt"
      - name: Build HodgeAttempt
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          test: false
          build-args: HodgeAttempt
