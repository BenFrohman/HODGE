name: Tagged source artifact

on:
  push:
    tags:
      - "v*"
      - "priority-*"

permissions:
  contents: read

jobs:
  source-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tagged source without publishing a release
        run: git archive --format=tar.gz HEAD > tagged-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tagged-source
          path: tagged-source.tar.gz
